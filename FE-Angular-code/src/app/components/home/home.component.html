<section>
    <app-header></app-header>
</section>
<div class="container">
    <div class="home-body container">
        <div class="row portfolio-container">
            <div id="portfolio-text" class="col">
                <div style="height: 20%; padding-left: 120px; padding-top: 70px;">
                    <h3>Hello {{userModel?.fullName}}</h3>
                </div>
                <div style="height: 80%; display: flex; text-align: center; max-width: 400px;">
                    <a style="font-size: 60px; font-weight: 700;">{{'home.welcomeMessage' | translate }}</a>
                </div>
            </div>
            <div class="col"></div>
        </div>
        <div style="text-align: center; padding-top: 40px">
            <div class="row services-container container" style="padding-top: 30px; padding-bottom: 50px;">
                <h2>{{'home.serviceList' | translate}}</h2>
                <div *ngFor="let service of ListServices" class="col-md-6 mb-4 text-center">
                    <div *ngIf="service.id == defaultServices.crypto.id" class="col card-body home-card"
                        [ngClass]="{'active':service.isActive}" (click)="onServiceClick(service.isActive, service.id)">
                        <h4>{{'home.services.crypto' | translate}}</h4>
                    </div>
                    <div *ngIf="service.id === defaultServices.shophouse.id" class="col home-card"
                        [ngClass]="{'active': service.isActive}" (click)="onServiceClick(service.isActive, service.id)">
                        <h4>{{'home.services.stock' | translate}}</h4>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
